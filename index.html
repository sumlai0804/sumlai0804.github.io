<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐廳客流統計系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold mb-4 text-center">餐廳客流統計</h1>
        
        <!-- 成功訊息提示框：設定為常駐不自動消失 -->
        <div id="successMsg" class="hidden mb-4 p-3 bg-green-100 text-green-700 rounded text-center text-sm font-bold border border-green-200"></div>

        <label class="block mb-2 font-semibold">1. 選擇餐廳:</label>
        <select id="restaurantSelect" class="w-full p-2 border rounded mb-4">
            <script>
                for(let i=1; i<=20; i++) document.write(`<option value="餐廳 ${i}">餐廳 ${i}</option>`);
            </script>
        </select>

        <label class="block mb-2 font-semibold">2. 選擇性別:</label>
        <div class="grid grid-cols-2 gap-4 mb-4">
            <button onclick="selectGender('男')" id="btn-男" class="gender-btn border-2 border-blue-500 text-blue-500 p-3 rounded-lg font-bold">男</button>
            <button onclick="selectGender('女')" id="btn-女" class="gender-btn border-2 border-pink-500 text-pink-500 p-3 rounded-lg font-bold">女</button>
        </div>

        <label class="block mb-2 font-semibold">3. 選擇年齡層:</label>
        <div class="grid grid-cols-3 gap-2">
            <script>
                ['0-9', '10-19', '20-29', '30-39', '40-49', '50-59', '60+'].forEach(a => {
                    document.write(`<button onclick="submitRecord('${a}')" class="bg-gray-200 hover:bg-gray-300 p-3 rounded font-bold">${a}</button>`);
                });
            </script>
        </div>

        <div class="mt-8 border-t pt-4">
            <div id="adminPanel" class="hidden space-y-2">
                <button onclick="downloadCSV()" class="w-full bg-green-600 text-white py-2 rounded font-bold">下載所有數據 (CSV)</button>
                <button onclick="deleteAllData()" class="w-full bg-red-600 text-white py-2 rounded font-bold">清除所有數據</button>
            </div>
            <button id="adminLoginBtn" onclick="adminLogin()" class="w-full text-sm text-gray-400">管理員登入</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBV1c6e5v7_HA2XtPI4jt5XCBZyc1sFZm0",
            authDomain: "restaurant-traffic-counter.firebaseapp.com",
            projectId: "restaurant-traffic-counter",
            storageBucket: "restaurant-traffic-counter.firebasestorage.app",
            messagingSenderId: "793500222607",
            appId: "1:793500222607:web:ab196a41ed3fadfa929cfa",
            measurementId: "G-NSZVDMMWYD"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let selectedGender = "";

        window.selectGender = (g) => {
            selectedGender = g;
            document.querySelectorAll('.gender-btn').forEach(btn => btn.classList.remove('bg-blue-500', 'bg-pink-500', 'text-white'));
            document.getElementById(`btn-${g}`).classList.add(g === '男' ? 'bg-blue-500' : 'bg-pink-500', 'text-white');
        };

        window.submitRecord = async (age) => {
            if (!selectedGender) { alert("請先選擇性別！"); return; }
            const res = document.getElementById('restaurantSelect').value;
            const now = new Date();
            
            try {
                await addDoc(collection(db, "traffic_logs"), {
                    restaurant: res,
                    gender: selectedGender,
                    ageGroup: age,
                    date: now.toLocaleDateString('zh-HK'), 
                    time: now.toLocaleTimeString('zh-HK')
                });
                
                const msg = document.getElementById('successMsg');
                msg.innerText = `✅ 已記錄: ${res} / ${selectedGender} / ${age}`;
                msg.classList.remove('hidden');
            } catch (e) { alert("寫入失敗。"); }
        };

        window.adminLogin = async () => {
            const email = prompt("管理員 Email:");
            const pwd = prompt("密碼:");
            try {
                await signInWithEmailAndPassword(auth, email, pwd);
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('adminLoginBtn').classList.add('hidden');
            } catch (e) { alert("登入失敗"); }
        };

        window.downloadCSV = async () => {
            const querySnapshot = await getDocs(collection(db, "traffic_logs"));
            let csv = "餐廳,性別,年齡層,日期,時間\n";
            querySnapshot.forEach(doc => {
                const d = doc.data();
                const res = d.restaurant || "";
                const gen = d.gender || "";
                const age = d.ageGroup ? `="${d.ageGroup}"` : "";
                const date = d.date || "";
                const time = d.time || "";
                csv += `${res},${gen},${age},${date},${time}\n`;
            });
            const blob = new Blob(["\ufeff", csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "traffic_data.csv";
            link.click();
        };

        window.deleteAllData = async () => {
            if (!confirm("確定要刪除所有數據嗎？此操作無法還原！")) return;
            const querySnapshot = await getDocs(collection(db, "traffic_logs"));
            for (const docSnapshot of querySnapshot.docs) {
                await deleteDoc(doc(db, "traffic_logs", docSnapshot.id));
            }
            alert("數據已全數清除，請重新整理頁面。");
        };
    </script>
</body>
</html>
