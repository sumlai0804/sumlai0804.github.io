<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 世界盃專業互動指南</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fafaf9; }
        .tab-active { color: #065f46; border-bottom: 3px solid #059669; }
        .match-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .channel-badge-bbc { background-color: #000000; color: #ffffff; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .channel-badge-itv { background-color: #1a4da1; color: #ffffff; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="text-slate-900">

    <header class="bg-emerald-950 text-white pt-10 pb-16 px-4">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-3xl font-bold mb-2">2026 世界盃專業互動指南</h1>
            <p class="text-emerald-200/80">HKT 時間 | 6/12-6/20 完整賽程 | A-L 組積分榜</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 -mt-8">
        <div class="bg-white rounded-xl shadow-lg border border-stone-200 mb-8 overflow-hidden">
            <div class="flex border-b border-stone-100">
                <button onclick="switchTab('schedule')" id="tab-schedule" class="flex-1 py-4 text-center font-bold tab-active">互動賽程表</button>
                <button onclick="switchTab('standings')" id="tab-standings" class="flex-1 py-4 text-center font-bold text-stone-400">小組積分榜 (A-L)</button>
            </div>
        </div>

        <div id="content-schedule" class="space-y-6 pb-20">
            <input type="text" id="searchInput" oninput="renderSchedule()" placeholder="搜尋隊伍..." class="w-full p-3 rounded-lg border border-stone-200 focus:ring-2 focus:ring-emerald-500 outline-none">
            
            <!-- 新增：API 載入中指示器 -->
            <div id="loadingIndicator" class="text-center py-12 hidden">
                <div class="inline-block animate-spin w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full mb-3"></div>
                <p class="text-stone-500 font-medium">正在連接伺服器，獲取最新賽程資料...</p>
            </div>

            <div id="scheduleList" class="space-y-8"></div>
        </div>

        <div id="content-standings" class="hidden pb-20">
            <div id="standingsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </main>

    <script>
        // 核心數據庫 (改用 let 以便 API 獲取新資料時覆寫)
        let matches = [
            { date: "6月12日", time: "10:00", teams: ["韓國", "捷克"], score: [2, 1], status: "finished", channel: "ITV Sport" },
            { date: "6月12日", time: "22:00", teams: ["墨西哥", "南非"], score: [2, 0], status: "finished", channel: "BBC Sport" },
            { date: "6月13日", time: "03:00", teams: ["加拿大", "波斯尼亞"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月13日", time: "09:00", teams: ["美國", "巴拉圭"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月14日", time: "03:00", teams: ["卡塔爾", "瑞士"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月14日", time: "06:00", teams: ["巴西", "摩洛哥"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月14日", time: "09:00", teams: ["海地", "蘇格蘭"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月14日", time: "12:00", teams: ["澳洲", "土耳其"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月15日", time: "01:00", teams: ["德國", "庫拉索"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月15日", time: "04:00", teams: ["荷蘭", "日本"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月15日", time: "07:00", teams: ["科特迪瓦", "厄瓜多爾"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月15日", time: "10:00", teams: ["瑞典", "突尼西亞"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月16日", time: "00:00", teams: ["西班牙", "維德角"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月16日", time: "03:00", teams: ["比利時", "埃及"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月16日", time: "06:00", teams: ["沙特阿拉伯", "烏拉圭"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月16日", time: "09:00", teams: ["伊朗", "新西蘭"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月17日", time: "03:00", teams: ["法國", "塞內加爾"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月17日", time: "06:00", teams: ["伊拉克", "挪威"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月18日", time: "09:00", teams: ["阿根廷", "阿爾及利亞"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月18日", time: "12:00", teams: ["奧地利", "約旦"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月18日", time: "18:00", teams: ["葡萄牙", "剛果民主共和國"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月18日", time: "21:00", teams: ["英格蘭", "克羅地亞"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月19日", time: "07:00", teams: ["加納", "巴拿馬"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月19日", time: "10:00", teams: ["烏茲別克", "哥倫比亞"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月19日", time: "22:00", teams: ["捷克", "南非"], score: [null, null], status: "scheduled", channel: "BBC Sport" },
            { date: "6月20日", time: "01:00", teams: ["瑞士", "波斯尼亞"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月20日", time: "04:00", teams: ["加拿大", "卡塔爾"], score: [null, null], status: "scheduled", channel: "ITV Sport" },
            { date: "6月20日", time: "09:00", teams: ["墨西哥", "韓國"], score: [null, null], status: "scheduled", channel: "BBC Sport" }
        ];

        let teamsData = {
            "Group A": { "墨西哥": 3, "韓國": 3, "捷克": 0, "南非": 0 },
            "Group B": { "加拿大": 0, "波斯尼亞": 0, "卡塔爾": 0, "瑞士": 0 },
            "Group C": { "美國": 0, "巴西": 0, "巴拉圭": 0, "摩洛哥": 0 },
            "Group D": { "法國": 0, "塞內加爾": 0, "伊拉克": 0, "挪威": 0 },
            "Group E": { "德國": 0, "日本": 0, "荷蘭": 0, "庫拉索": 0 },
            "Group F": { "西班牙": 0, "比利時": 0, "埃及": 0, "維德角": 0 },
            "Group G": { "英格蘭": 0, "克羅地亞": 0, "奧地利": 0, "約旦": 0 },
            "Group H": { "阿根廷": 0, "葡萄牙": 0, "加納": 0, "巴拿馬": 0 },
            "Group I": { "澳洲": 0, "土耳其": 0, "烏拉圭": 0, "沙特阿拉伯": 0 },
            "Group J": { "瑞典": 0, "突尼西亞": 0, "伊朗": 0, "新西蘭": 0 },
            "Group K": { "厄瓜多爾": 0, "科特迪瓦": 0, "蘇格蘭": 0, "海地": 0 },
            "Group L": { "哥倫比亞": 0, "烏茲別克": 0, "剛果": 0, "摩納哥": 0 }
        };

        // --- 新增：Fetch API 資料獲取邏輯 ---
        const API_URL = 'https://api.football-data.org/v4/competitions/WC/matches'; // 示範：Football-Data.org API
        const API_TOKEN = 'd300af14181d4b7fbab1b0a461fb3254'; // 實際部署時請替換成你申請的 API Key

        async function fetchLatestSchedule() {
            const loading = document.getElementById('loadingIndicator');
            const scheduleList = document.getElementById('scheduleList');
            
            // 顯示載入動畫，隱藏原本的列表
            loading.classList.remove('hidden');
            scheduleList.classList.add('hidden');

            try {
                // 發送非同步 fetch 請求
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'X-Auth-Token': API_TOKEN }
                });

                if (!response.ok) {
                    throw new Error('API 請求失敗 (可能是未設定有效的 API Token)');
                }
                
                const data = await response.json();
                
                // 這裡模擬將 API 回傳的資料結構，轉換為我們前端渲染需要的格式
                if (data.matches && data.matches.length > 0) {
                    matches = data.matches.map(m => ({
                        date: new Date(m.utcDate).toLocaleDateString('zh-HK', { month: 'short', day: 'numeric' }),
                        time: new Date(m.utcDate).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' }),
                        teams: [m.homeTeam.name || "未定", m.awayTeam.name || "未定"],
                        score: [m.score.fullTime.home, m.score.fullTime.away],
                        status: m.status === 'FINISHED' ? 'finished' : 'scheduled',
                        channel: Math.random() > 0.5 ? 'BBC Sport' : 'ITV Sport' // 隨機分配頻道作模擬
                    }));
                }
            } catch (error) {
                console.warn('API 獲取失敗，自動降級使用本地快取數據：', error.message);
                // 為了讓你看見載入效果，這裡刻意加入 1.5 秒的延遲來模擬網路請求過程
                await new Promise(resolve => setTimeout(resolve, 1500));
            } finally {
                // 資料處理完畢後，隱藏載入動畫並顯示更新後的列表
                loading.classList.add('hidden');
                scheduleList.classList.remove('hidden');
                
                // 執行渲染
                renderSchedule(); 
                renderStandings();
            }
        }

        function switchTab(tab) {
            document.getElementById('content-schedule').classList.toggle('hidden', tab !== 'schedule');
            document.getElementById('content-standings').classList.toggle('hidden', tab !== 'standings');
            document.getElementById('tab-schedule').className = tab === 'schedule' ? 'flex-1 py-4 text-center font-bold tab-active' : 'flex-1 py-4 text-center font-bold text-stone-400';
            document.getElementById('tab-standings').className = tab === 'standings' ? 'flex-1 py-4 text-center font-bold tab-active' : 'flex-1 py-4 text-center font-bold text-stone-400';
        }

        function renderSchedule() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('scheduleList');
            const filtered = matches.filter(m => m.teams.some(t => t.toLowerCase().includes(filter)));
            
            const grouped = filtered.reduce((acc, match) => {
                (acc[match.date] = acc[match.date] || []).push(match);
                return acc;
            }, {});

            container.innerHTML = Object.keys(grouped).map(date => `
                <div>
                    <h3 class="font-bold text-emerald-800 text-lg mb-4 border-l-4 border-emerald-500 pl-3">${date}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${grouped[date].map(m => `
                            <div class="match-card bg-white p-4 rounded-xl border border-stone-100 shadow-sm flex items-center justify-between">
                                <div>
                                    <div class="text-xs font-bold text-emerald-600">${m.time} HKT</div>
                                    <div class="text-md font-bold">${m.teams[0]} vs ${m.teams[1]}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-lg font-mono font-bold">${m.status === 'finished' ? `${m.score[0]}:${m.score[1]}` : 'VS'}</div>
                                    <div class="${m.channel.includes('BBC') ? 'channel-badge-bbc' : 'channel-badge-itv'} uppercase">${m.channel.split(' ')[0]}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderStandings() {
            const container = document.getElementById('standingsGrid');
            container.innerHTML = Object.keys(teamsData).map(g => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200">
                    <h3 class="font-bold mb-3 text-emerald-800 text-sm border-b pb-2">${g}</h3>
                    <table class="w-full text-xs">
                        ${Object.keys(teamsData[g]).sort((a,b) => teamsData[g][b] - teamsData[g][a]).map(t => `<tr class="border-b last:border-0"><td class="py-2">${t}</td><td class="text-right font-bold text-emerald-700">${teamsData[g][t]} Pts</td></tr>`).join('')}
                    </table>
                </div>
            `).join('');
        }

        // 修改 onload 事件，改為執行 fetch 請求
        window.onload = () => { fetchLatestSchedule(); };
    </script>
</body>
</html>
