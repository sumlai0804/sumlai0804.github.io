        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fafaf9; }
        .tab-active { color: #065f46; border-bottom: 3px solid #059669; }
        .match-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .match-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1); }
        .channel-badge-bbc { background-color: #000000; color: #ffffff; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .channel-badge-itv { background-color: #1a4da1; color: #ffffff; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .sticky-controls { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(8px); background-color: rgba(250, 250, 249, 0.95); }
    </style>
</head>

            </div>
        </div>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-emerald-600/20 via-transparent to-transparent pointer-events-none"></div>
    </header>

        <!-- 分頁切換區塊 -->
        <div class="bg-white rounded-xl shadow-lg border border-stone-200 mb-8 overflow-hidden sticky-controls">
            <div class="flex border-b border-stone-100">
                <button onclick="switchTab('schedule')" id="tab-schedule" class="flex-1 py-4 text-center font-bold tab-active transition-all">互動賽程表</button>
                <button onclick="switchTab('standings')" id="tab-standings" class="flex-1 py-4 text-center font-bold text-stone-400 hover:text-emerald-700 transition-all">小組積分榜 (A-L)</button>
            </div>
        </div>

        <!-- 互動賽程分頁 -->
        <div id="content-schedule" class="space-y-6 pb-20">
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="searchInput" oninput="renderSchedule()" placeholder="搜尋隊伍..." class="flex-1 p-3 rounded-lg border border-stone-200 focus:ring-2 focus:ring-emerald-500 outline-none shadow-sm">
                <div class="flex rounded-lg border border-stone-200 bg-white p-1 shadow-sm">
                    <button onclick="filterByChannel('All')" class="channel-filter-btn px-4 py-2 text-xs font-bold rounded bg-emerald-600 text-white transition-all">全部</button>
                    <button onclick="filterByChannel('BBC Sport')" class="channel-filter-btn px-4 py-2 text-xs font-bold rounded text-slate-600 hover:bg-slate-100 transition-all">BBC 直播</button>

                </div>
            </div>
            
            <!-- API 載入中指示器 -->
            <div id="loadingIndicator" class="text-center py-12">
                <div class="inline-block animate-spin w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full mb-3"></div>
                <p class="text-stone-500 font-medium">正在獲取最新官方賽事資料...</p>
            </div>

            <div id="scheduleList" class="space-y-8 hidden"></div>
        </div>

                { team: "葡萄牙", played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
                { team: "剛果民主共和國", played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
                { team: "英格蘭", played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
                { team: "克羅地亞", played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }
            ],
            "Group L": [
                { team: "加納", played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
                { team: "巴拿馬", played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
                { team: "烏茲別克", played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
                { team: "哥倫比亞", played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }
            ]
        };

        let matches = [];
        let teamsData = {};
        let currentFilterChannel = 'All';

        function initData() {
            matches = JSON.parse(JSON.stringify(defaultMatches));
            teamsData = JSON.parse(JSON.stringify(defaultTeamsData));
        }

        function getFlagUrl(teamName) {
            const code = flagMap[teamName];
            if (!code) return `https://placehold.co/24x16/eaeaea/999999?text=⚽`;
            return `https://flagcdn.com/w40/${code}.png`;
        }

        function translateTeamName(name) {
            if (!name) return "未知";
            let cleanName = name.trim().replace(/-/g, ' ').replace(/&/g, 'and');
            if (englishToChineseTeamMap[cleanName]) {
                return englishToChineseTeamMap[cleanName];
            }
            for (const key in englishToChineseTeamMap) {
                if (cleanName.toLowerCase() === key.toLowerCase() || cleanName.toLowerCase().includes(key.toLowerCase())) {
                    return englishToChineseTeamMap[key];
                }
            }
            return name;
        }

        const API_RAW_URL = 'https://api.football-data.org/v4/competitions/WC/matches';
        const API_TOKEN = 'd300af14181d4b7fbab1b0a461fb3254';

        // 智能多代理重試陣列 (AllOrigins 完美保留自訂 Request Headers，而 corsproxy 為備用)
        const proxies = [
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`
        ];

        // 引入本地快取控制變數 (快取有效期 5 分鐘)
        const CACHE_KEY = 'wc2026_matches_cache';
        const CACHE_TIME_KEY = 'wc2026_matches_cache_time';
        const CACHE_EXPIRY = 5 * 60 * 1000; 

        // 帶有超時控制的 fetch 輔助函數
        function fetchWithTimeout(url, options, timeout = 3000) {
            return Promise.race([
                fetch(url, options),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), timeout))
            ]);
        }

        async function fetchWithRetry(url, token, proxyIndex = 0) {
            if (proxyIndex >= proxies.length) {
                throw new Error("所有 CORS 代理連線均告失敗。");
            }
            const proxiedUrl = proxies[proxyIndex](url);
            console.log(`正在使用代理 [${proxyIndex}] 連線: ${proxiedUrl}`);
            
            try {
                // 每家代理限制最長 3 秒回應，超過即斷開換下一家，大幅提升載入流暢度
                const response = await fetchWithTimeout(proxiedUrl, {
                    method: 'GET',
                    headers: { 'X-Auth-Token': token }
                }, 3000);
                
                if (response.ok) {
                    return await response.json();
                }
                throw new Error(`HTTP 錯誤狀態: ${response.status}`);
            } catch (err) {
                console.warn(`代理 [${proxyIndex}] 失敗或超時，嘗試下一個...`, err.message);
                return await fetchWithRetry(url, token, proxyIndex + 1);
            }
        }

        async function fetchLatestSchedule() {
            const loading = document.getElementById('loadingIndicator');
            const scheduleList = document.getElementById('scheduleList');
            const apiStatus = document.getElementById('apiStatus');

            initData();

            const cachedMatches = localStorage.getItem(CACHE_KEY);
            const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
            const now = Date.now();
            
            let hasFreshCache = false;

            // 1. 率先讀取本地緩存：實現「0 秒」開屏載入
            if (cachedMatches && cachedTime) {
                try {
                    matches = JSON.parse(cachedMatches);
                    recalculateStandings();
                    
                    // 立即渲染畫面，讓用戶立刻看到賽程與積分榜，不需等待 API
                    loading.classList.add('hidden');
                    scheduleList.classList.remove('hidden');
                    renderSchedule(true); // 自動滾動至今日
                    renderStandings();
                    renderJumpButtons();

                    apiStatus.innerText = '載入本地緩存中';
                    apiStatus.className = 'bg-blue-500/15 text-blue-300 border border-blue-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold';

                    // 判斷緩存是否新鮮（小於 5 分鐘）
                    if (now - parseInt(cachedTime) < CACHE_EXPIRY) {
                        hasFreshCache = true;
                    }
                } catch (e) {
                    console.warn("解析本地緩存失敗", e);
                }
            }

            // 2. 如果快取在 5 分鐘內，直接視為同步完成，不再耗費網路請求
            if (hasFreshCache) {
                apiStatus.innerText = '實時數據同步中 (緩存)';
                apiStatus.className = 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold';
                return;
            }

            const isBackgroundFetch = !!cachedMatches;

            if (!isBackgroundFetch) {
                // 完全無快取時才顯示全螢幕轉圈圈
                loading.classList.remove('hidden');
                scheduleList.classList.add('hidden');
            } else {
                // 背景靜默更新，不阻礙用戶瀏覽已加載的內容
                apiStatus.innerText = '背景更新中...';
                apiStatus.className = 'bg-amber-500/15 text-amber-300 border border-amber-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold animate-pulse';
            }

            let dataLoaded = false;

            try {
                const data = await fetchWithRetry(API_RAW_URL, API_TOKEN);
                if (data && data.matches && data.matches.length > 0) {
                    parseApiMatches(data.matches);
                    
                    // 寫入快取與時間戳
                    localStorage.setItem(CACHE_KEY, JSON.stringify(matches));
                    localStorage.setItem(CACHE_TIME_KEY, now.toString());

                    dataLoaded = true;
                    apiStatus.innerText = '實時數據同步中';
                    apiStatus.className = 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold';
                }
            } catch (e) {
                console.warn("API 獲取失敗，已自動降級至最精準本地 2026 世界盃數據庫。", e);
            }

            if (!dataLoaded) {
                if (!isBackgroundFetch) {
                    apiStatus.innerText = '本地數據庫運行中';
                    apiStatus.className = 'bg-stone-500/15 text-stone-300 border border-stone-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold';
                    recalculateStandings();
                    loading.classList.add('hidden');
                    scheduleList.classList.remove('hidden');
                    renderSchedule(true);
                    renderStandings();
                    renderJumpButtons();
                } else {
                    apiStatus.innerText = '數據同步失敗 (使用舊緩存)';
                    apiStatus.className = 'bg-red-500/15 text-red-300 border border-red-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold';
                }
            } else {
                // 成功獲取新 API 數據，無縫刷新排版
                recalculateStandings();
                loading.classList.add('hidden');
                scheduleList.classList.remove('hidden');
                renderSchedule(false); // 避免背景刷新時畫面突然強制滾動
                renderStandings();
                renderJumpButtons();
            }
        }

        function parseApiMatches(apiMatches) {
            matches = apiMatches.map(m => {
                const utcDate = new Date(m.utcDate);
                const localDateStr = utcDate.toLocaleDateString('zh-HK', { month: 'short', day: 'numeric', weekday: 'short' });
                const localTimeStr = utcDate.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
                
                const homeScore = m.score?.fullTime?.home;
                const awayScore = m.score?.fullTime?.away;
                
                let status = 'scheduled';
                if (m.status === 'FINISHED') {
                    status = 'finished';
                } else if (['LIVE', 'IN_PLAY', 'PAUSED'].includes(m.status)) {
                    status = 'live';
                }

                return {
                    date: localDateStr,
                    time: localTimeStr,
                    teams: [translateTeamName(m.homeTeam.name), translateTeamName(m.awayTeam.name)],
                    score: [homeScore, awayScore],
                    status: status,
                    channel: m.id % 2 === 0 ? 'BBC Sport' : 'ITV Sport'
                };
            });
        }

        function getGroupOfTeam(teamName) {
            for (const groupName in teamsData) {
                const found = teamsData[groupName].some(t => t.team === teamName);
                if (found) return groupName;
            }
            return null;
        }

        function recalculateStandings() {
            // 重置所有小組的積分榜數據
            for (const groupName in teamsData) {
                teamsData[groupName].forEach(t => {
                    t.played = 0;
                    t.w = 0; t.d = 0; t.l = 0;
                    t.gf = 0; t.ga = 0; t.pts = 0;
                });
            }

            // 根據 matches 的數據，動態累加計算積分
            matches.forEach(m => {
                if ((m.status === 'finished' || m.status === 'live') && m.score[0] !== null && m.score[1] !== null) {
                    const homeTeam = m.teams[0];
                    const awayTeam = m.teams[1];
                    const homeGroup = getGroupOfTeam(homeTeam);
                    const awayGroup = getGroupOfTeam(awayTeam);

                    if (homeGroup) {
                        const t = teamsData[homeGroup].find(x => x.team === homeTeam);
                        if (t) {
                            t.played += 1;
                            t.gf += parseInt(m.score[0]);
                            t.ga += parseInt(m.score[1]);
                            if (m.score[0] > m.score[1]) { t.w += 1; t.pts += 3; }
                            else if (m.score[0] < m.score[1]) { t.l += 1; }
                            else { t.d += 1; t.pts += 1; }
                        }
                    }

                    if (awayGroup) {
                        const t = teamsData[awayGroup].find(x => x.team === awayTeam);
                        if (t) {
                            t.played += 1;
                            t.gf += parseInt(m.score[1]);
                            t.ga += parseInt(m.score[0]);
                            if (m.score[1] > m.score[0]) { t.w += 1; t.pts += 3; }
                            else if (m.score[1] < m.score[0]) { t.l += 1; }
                            else { t.d += 1; t.pts += 1; }
                        }
                    }
                }
            });
        }

        function switchTab(tab) {
            document.getElementById('content-schedule').classList.toggle('hidden', tab !== 'schedule');
            document.getElementById('content-standings').classList.toggle('hidden', tab !== 'standings');
            document.getElementById('tab-schedule').className = tab === 'schedule' ? 'flex-1 py-4 text-center font-bold tab-active transition-all' : 'flex-1 py-4 text-center font-bold text-stone-400 hover:text-emerald-700 transition-all';
            document.getElementById('tab-standings').className = tab === 'standings' ? 'flex-1 py-4 text-center font-bold tab-active transition-all' : 'flex-1 py-4 text-center font-bold text-stone-400 hover:text-emerald-700 transition-all';
        }

        function filterByChannel(channel) {
            currentFilterChannel = channel;
            const buttons = document.querySelectorAll('.channel-filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white');
                btn.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            event.target.classList.add('bg-emerald-600', 'text-white');
            event.target.classList.remove('text-slate-600', 'hover:bg-slate-100');
            renderSchedule(false);
        }

        function renderSchedule(forceScroll = false) {
            const filterText = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('scheduleList');
            
            const filtered = matches.filter(m => {
                const matchesSearch = m.teams.some(t => t.toLowerCase().includes(filterText));
                const matchesChannel = (currentFilterChannel === 'All' || m.channel === currentFilterChannel);
                return matchesSearch && matchesChannel;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-xl border border-stone-100">
                        <p class="text-stone-400 font-medium">沒有符合條件的賽事</p>
                    </div>`;
                return;
            }
            
            const grouped = filtered.reduce((acc, match) => {
                (acc[match.date] = acc[match.date] || []).push(match);
                return acc;
            }, {});

            container.innerHTML = Object.keys(grouped).map(date => `
                <div class="date-group-section">
                    <h3 class="font-bold text-emerald-900 text-lg mb-4 border-l-4 border-emerald-600 pl-3 transition-all duration-500">${date}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${grouped[date].map(m => {
                            const isLive = m.status === 'live';
                            const isFinished = m.status === 'finished';
                            
                            return `
                                <div class="match-card bg-white p-5 rounded-xl border border-stone-100 shadow-sm flex items-center justify-between">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-1.5 mb-2">
                                            <span class="text-xs font-bold ${isLive ? 'text-red-500' : 'text-emerald-600'}">${m.time} HKT</span>
                                            ${isLive ? `
                                                <span class="flex items-center gap-1">
                                                    <span class="relative flex h-2 w-2">
                                                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                                        <span class="relative inline-flex rounded-full h-2 w-2 bg-red-600"></span>
                                                    </span>
                                                    <span class="bg-red-500 text-white font-extrabold text-[9px] px-1.5 py-0.5 rounded animate-pulse">LIVE直播中</span>
                                                </span>
                                            ` : ''}
                                        </div>
                                        <div class="space-y-2">
                                            <div class="flex items-center gap-2">
                                                <img src="${getFlagUrl(m.teams[0])}" class="w-6 h-4 object-cover rounded shadow-sm border border-stone-100" alt="flag">
                                                <span class="font-bold text-slate-800 text-sm md:text-base">${m.teams[0]}</span>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <img src="${getFlagUrl(m.teams[1])}" class="w-6 h-4 object-cover rounded shadow-sm border border-stone-100" alt="flag">
                                                <span class="font-bold text-slate-800 text-sm md:text-base">${m.teams[1]}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-right pl-4">
                                        <div class="text-lg md:text-xl font-mono font-bold text-slate-900 bg-stone-50 px-3 py-1.5 rounded-lg border border-stone-100 inline-block mb-2 text-center min-w-[70px]">
                                            ${isFinished ? `${m.score[0]} : ${m.score[1]}` : (isLive ? `<span class="text-red-600 font-extrabold animate-pulse">${m.score[0]} : ${m.score[1]}</span>` : 'VS')}
                                        </div>
                                        <div class="flex flex-col items-end gap-1">
                                            <span class="${m.channel.includes('BBC') ? 'channel-badge-bbc' : 'channel-badge-itv'} uppercase">${m.channel}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');

            if (forceScroll) {
                setTimeout(scrollToToday, 250);
            }
        }

        function scrollToToday() {
            // 獲取今天日期並動態格式化
            const today = new Date();
            const month = today.getMonth() + 1;
            const date = today.getDate();
            const todayStr = `${month}月${date}日`; 

            const headers = document.querySelectorAll('#scheduleList h3');
            let matchedHeader = null;

            for (const header of headers) {
                if (header.innerText.includes(todayStr)) {
                    matchedHeader = header;
                    break;
                }
            }

            // 備用方案：如果今天沒有比賽，自動往後尋找最接近的有比賽日期
            if (!matchedHeader) {
                for (const header of headers) {
                    const match = header.innerText.match(/(\d+)月(\d+)日/);
                    if (match) {
                        const m = parseInt(match[1]);
                        const d = parseInt(match[2]);
                        const headerDate = new Date(2026, m - 1, d);
                        if (headerDate >= today) {
                            matchedHeader = header;
                            break;
                        }
                    }
                }
            }

            if (matchedHeader) {
                const yOffset = -120;
                const yPosition = matchedHeader.getBoundingClientRect().top + window.pageYOffset + yOffset;
                
                window.scrollTo({
                    top: yPosition,
                    behavior: 'smooth'
                });

                // 2秒高亮閃爍效果
                matchedHeader.classList.add('bg-emerald-100/60', 'p-1', 'pr-4', 'rounded-r-lg');
                setTimeout(() => {
                    matchedHeader.classList.remove('bg-emerald-100/60', 'p-1', 'pr-4', 'rounded-r-lg');
                }, 2000);
            }
        }

        function renderJumpButtons() {
            const container = document.getElementById('groupJumpAnchors');
            container.innerHTML = Object.keys(teamsData).map(g => `
                <a href="#group-${g.replace(' ', '-')}" class="px-2.5 py-1 bg-stone-100 hover:bg-emerald-50 hover:text-emerald-700 text-stone-600 text-xs font-semibold rounded-md border border-stone-200 transition-all whitespace-nowrap">
                    ${g}
                </a>
            `).join('');
        }

        function renderStandings() {
            const container = document.getElementById('standingsGrid');
            container.innerHTML = Object.keys(teamsData).map(g => {
                const sortedTeams = [...teamsData[g]].sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
                return `
                    <div id="group-${g.replace(' ', '-')}" class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 scroll-mt-24">
                        <div class="flex justify-between items-center mb-3 border-b pb-2">
                            <h3 class="font-bold text-emerald-900 text-sm">${g}</h3>
                            <span class="text-[10px] font-bold text-stone-400">PTS</span>
                        </div>
                        <table class="w-full text-xs">
                            <tbody>
                                ${sortedTeams.map((t, idx) => `
                                    <tr class="border-b border-stone-50 last:border-0 hover:bg-stone-50 transition-colors">
                                        <td class="py-2.5 font-bold text-stone-400 w-5">${idx + 1}</td>
                                        <td class="py-2.5">
                                            <div class="flex items-center gap-2">
                                                <img src="${getFlagUrl(t.team)}" class="w-5 h-3.5 object-cover rounded border border-stone-100" alt="flag">
                                                <span class="font-semibold text-stone-800">${t.team}</span>
                                            </div>
                                        </td>
                                        <td class="py-2.5 text-center text-[10px] text-stone-400 px-1">賽 ${t.played || 0}</td>
                                        <td class="py-2.5 text-right font-bold text-emerald-800 text-sm">${t.pts} Pts</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }).join('');
        }

        window.onload = () => { fetchLatestSchedule(); };
    </script>
